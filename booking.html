<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room booking · Sri Ambalavanar Cottage, Mayiladuthurai</title>
<meta name="description" content="Book your room at Sri Ambalavanar Cottage, Mayiladuthurai. Pick your room on the floor plan, pay by UPI and get your GST invoice at once.">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0F1E2E; --muted:#5B6878; --line:#E6E9EE; --soft:#F5F7F9;
  --teal:#0F766E; --teal-d:#115E59; --teal-l:#ECF6F5; --navy:#0B1B2B;
  --wa:#1FA855; --free:#ECFDF5; --free-b:#34D399; --free-i:#065F46;
  --hold:#FFF7ED; --hold-b:#F59E0B; --hold-i:#9A3412;
  --font:"Plus Jakarta Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.55 var(--font);color:var(--ink);background:var(--soft);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:var(--teal);text-decoration:none}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #F59E0B;outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 15px var(--font);padding:13px 20px;border-radius:12px;text-align:center;white-space:normal}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover:not(:disabled){background:var(--teal-d)}
.btn-dark{background:var(--navy);color:#fff}
.btn-wa{background:var(--wa);color:#fff}.btn-wa:hover{background:#178A45}
.btn-out{background:#fff;color:var(--ink);border:1px solid #D7DDE4}.btn-out:hover{border-color:var(--teal);color:var(--teal)}
.btn-big{padding:16px 22px;font-size:17px;font-weight:800;width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:20px}

/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:var(--ink);min-width:0}
.brand img{width:44px;height:44px;border-radius:50%;flex:none}
.brand b{font-size:17px;font-weight:800;line-height:1.2;display:block}
.brand small{display:block;font-size:12px;color:var(--muted)}
.lang{display:flex;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;border-radius:999px;padding:7px 12px;min-height:34px;background:transparent;color:var(--muted);font:600 13px var(--font);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.back{font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:560px){.back{display:none}.brand small{display:none}.brand b{font-size:15px}}

main{padding-block:22px 64px}
.steps{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:14px;font-weight:700}
.steps li{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;background:#fff;color:var(--muted);border:1px solid var(--line);min-width:0}
.steps li span{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none;font-size:13px}
.steps li em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.done{background:var(--teal-l);color:#0F5F59;border-color:transparent}
.steps li.done span{background:var(--teal);color:#fff}
.steps li.now{background:var(--teal);color:#fff;border-color:var(--teal)}
.steps li.now span{background:#fff;color:var(--teal)}
@media (max-width:640px){.steps li{justify-content:center;padding:9px 6px}.steps li em{display:none}.steps li.now em{display:inline}.steps{grid-template-columns:auto auto auto auto;justify-content:start}.steps li.now{padding-inline:12px}}

.title{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.title h1{font-size:clamp(24px,3.4vw,32px);font-weight:800}
html[lang="ta"] .title h1{font-size:clamp(22px,3vw,28px);line-height:1.35}
.title p{color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:20px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}

/* dates bar */
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;margin-bottom:16px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font:600 16px var(--font);color:var(--ink);padding:11px 12px;border:1px solid #D7DDE4;border-radius:10px;background:#fff;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
.nights{font-size:14px;color:var(--muted);font-weight:600;align-self:center}
.nights b{color:var(--ink);font-size:20px;display:block}
@media (max-width:520px){.dates{grid-template-columns:repeat(2,minmax(0,1fr))}.nights{grid-column:span 2}}

/* floor plan */
.floors{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.bp{min-width:620px;border:3px solid var(--navy);border-radius:8px;background:#F8FAFB;display:flex;flex-direction:column;position:relative}
.prow{display:grid;gap:0}
.prow>*{border-radius:0;border-width:0;border-right:2px solid #CBD3DC}
.prow>*:last-child{border-right:0}
.prow.back{border-bottom:2px solid #CBD3DC}
.prow.front{border-top:2px solid #CBD3DC}
.corr2{height:46px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.35em;color:#8A95A3;font-weight:700;position:relative;background:repeating-linear-gradient(90deg,transparent 0 18px,#EEF1F4 18px 20px)}
.ent{position:absolute;left:-3px;top:50%;transform:translate(-100%,-50%);background:#B45309;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 8px;border-radius:8px 0 0 8px;white-space:nowrap}
.bp{margin-left:92px}
@media (max-width:700px){.bp{min-width:560px;margin-left:78px}.ent{font-size:10px;padding:5px 6px}}
.cell{height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;line-height:1.2;padding:4px;color:#475569;background:#EEF1F4;min-width:0}
.cell.stairs{background:repeating-linear-gradient(90deg,#fff 0 7px,#D9E0E8 7px 9px);color:#334155}
.cell.rec{background:var(--navy);color:#fff}
.cell.hk,.cell.shop{background:#E7E3DA;color:#6B5E4B}
.cell small{font-weight:600;font-size:10px;opacity:.85}
.swipe{display:none;font-size:12px;color:var(--muted)}
@media (max-width:700px){.swipe{display:block}}
.floor{padding:16px;display:flex;flex-direction:column;gap:10px}
.floor-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.floor-h h2{font-size:18px;font-weight:800}
.floor-h span{font-size:13px;color:var(--muted)}
.plan{border:3px solid var(--navy);border-radius:10px;padding:10px;background:#F8FAFB;display:flex;flex-direction:column;gap:8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.col-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.08em;height:16px}
.corr{flex:1;border-left:2px dashed #CBD3DC;border-right:2px dashed #CBD3DC;display:grid;place-items:center;min-height:60px}
.corr span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.3em;color:#8A95A3;font-weight:700}
.fix{height:64px;border-radius:8px;display:grid;place-items:center;font-size:9.5px;font-weight:700;text-align:center;padding:2px;line-height:1.2}
.fix.stairs{border:1.5px solid #94A3B8;background:repeating-linear-gradient(0deg,#fff 0 6px,#E2E8F0 6px 8px);color:#475569}
.fix.rec{background:var(--navy);color:#fff;font-size:8.5px;overflow-wrap:anywhere}
.door{align-self:center;color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:0 0 10px 10px;margin-top:-13px}
.endrow{display:flex;justify-content:center}
.endrow .room{width:60%}
.room{height:74px;border-radius:0;border:0;box-shadow:inset 0 0 0 2px var(--free-b);background:var(--free);color:var(--free-i);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;min-width:0;line-height:1.15}
.room b{font-size:16px;line-height:1.1}
.room small{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.room:hover{box-shadow:inset 0 0 0 4px var(--free-b)}
.room.sel{background:var(--teal);box-shadow:inset 0 0 0 2px var(--teal);color:#fff}
.room.booked{box-shadow:none;background:repeating-linear-gradient(45deg,#EEF1F4 0 8px,#F7F8FA 8px 16px);color:#8A95A3;cursor:not-allowed;box-shadow:none}
.room.hold{box-shadow:inset 0 0 0 2px var(--hold-b);background:var(--hold);color:var(--hold-i);cursor:not-allowed}
.room.loading{opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;font-weight:600;padding:12px 14px;margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* side panel */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:86px}
@media (max-width:960px){.side{position:static}}
.sum{overflow:hidden}
.sum>img{width:100%;height:170px;object-fit:cover}
.sum-b{padding:18px;display:flex;flex-direction:column;gap:10px}
.sum-b h3{font-size:21px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row span{color:var(--muted)}
.row.tot{font-size:19px;border-top:2px solid var(--ink);padding-top:10px;margin-top:2px}
.row.tot span{color:var(--ink);font-weight:700}
.hr{border-top:1px solid #EEF1F4}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#F1F4F7;padding:4px;border-radius:12px}
.seg button{border:0;border-radius:9px;padding:10px 6px;background:transparent;font:600 14px var(--font);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink);font-weight:800}
.small{font-size:12.5px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* banners */
.lock{display:flex;gap:10px;align-items:center;background:var(--hold);border:1px solid #FDD8A8;color:#7C2D12;border-radius:12px;padding:12px 16px;font-weight:600;margin-bottom:16px}
.lock svg{width:20px;height:20px;flex:none}
.lock.over{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.msg.err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.msg.ok{background:#ECFDF3;border:1px solid #A7F3D0;color:#14532D}

/* form */
.form{padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form .field{color:var(--ink);font-size:14px}
.err{color:#B91C1C;font-size:13px;font-weight:600}
.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stp{border:1px solid #D7DDE4;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stp>b{font-size:14px}
.stp>small{font-size:12px;color:var(--muted);margin-top:-6px}
.stp div{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stp button{width:38px;height:38px;border-radius:10px;border:1px solid #D7DDE4;background:#fff;font:700 18px var(--font);cursor:pointer;flex:none}
.stp button:disabled{opacity:.35;cursor:not-allowed}
.stp output{font-size:20px;font-weight:800}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr);padding:18px}.steppers{grid-template-columns:minmax(0,1fr)}.stp{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}.stp>small{margin-top:0;width:100%;order:3}}

/* pay */
.pay{padding:24px;display:flex;flex-direction:column;gap:16px}
.apps{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:13px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-align:center}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.qrbox{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.qr{width:220px;height:220px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff;flex:none}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}
.upi{flex:1 1 220px;display:flex;flex-direction:column;gap:10px;min-width:0}
.upi-id{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.upi-id b{overflow-wrap:anywhere;font-size:15px}
.upi-id .btn{padding:8px 12px;font-size:13px}
.utr{border-top:1px solid #EEF1F4;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.utr-row{display:flex;flex-wrap:wrap;gap:10px}
.utr-row input{flex:1 1 220px;font:700 18px var(--font);letter-spacing:.08em;padding:12px;border:1px solid #D7DDE4;border-radius:10px;min-width:0}
.safe{background:var(--navy);color:#D5DEE8;border-radius:16px;padding:14px 16px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.safe svg{width:22px;height:22px;flex:none;color:#5EEAD4}
@media (max-width:520px){.qr{width:100%;max-width:260px;height:auto;aspect-ratio:1;margin:0 auto}.pay{padding:18px}}

/* done */
.done-h{padding:24px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:18px}
.tick{width:64px;height:64px;border-radius:50%;background:#DCFCE7;display:grid;place-items:center;flex:none}
.tick svg{width:34px;height:34px}
.done-t{flex:1 1 320px;display:flex;flex-direction:column;gap:4px;min-width:0}
.done-t h1{font-size:clamp(22px,3vw,30px);font-weight:800}
.done-acts{display:flex;flex-wrap:wrap;gap:10px}
.docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.doc{padding:10px;display:flex;flex-direction:column;gap:8px}
.doc img{width:100%;border-radius:6px;border:1px solid var(--line)}
.doc b{font-size:14px;padding:2px 4px}
@media (max-width:760px){.docs{grid-template-columns:minmax(0,1fr)}.done-acts .btn{flex:1 1 100%}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="logo-180.png" alt="" width="44" height="44">
      <span><b data-t="brand"></b><small data-t="brandSub"></small></span>
    </a>
    <a class="back" href="index.html" data-t="back"></a>
    <span class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">ENG</button>
      <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
    </span>
  </div>
</header>

<main class="wrap">
  <ol class="steps" id="steps">
    <li><span>1</span><em data-t="st1"></em></li>
    <li><span>2</span><em data-t="st2"></em></li>
    <li><span>3</span><em data-t="st3"></em></li>
    <li><span>4</span><em data-t="st4"></em></li>
  </ol>

  <!-- STEP 1: choose a room -->
  <section id="s1" aria-labelledby="h1">
    <div class="title"><h1 id="h1" data-t="h1"></h1><p data-t="p1"></p></div>
    <div class="card dates">
      <label class="field"><span data-t="checkin"></span><input type="date" id="d-in"></label>
      <label class="field"><span data-t="checkout"></span><input type="date" id="d-out"></label>
      <div class="nights" id="nights"></div>
    </div>
    <div class="card legend">
      <span><i style="background:var(--free);border:2px solid var(--free-b)"></i><em style="font-style:normal" data-t="lgFree"></em></span>
      <span><i style="background:var(--teal)"></i><em style="font-style:normal" data-t="lgSel"></em></span>
      <span><i style="background:var(--hold);border:2px solid var(--hold-b)"></i><em style="font-style:normal" data-t="lgHold"></em></span>
      <span><i style="background:#EEF1F4;border:2px dashed #CBD3DC"></i><em style="font-style:normal" data-t="lgBooked"></em></span>
    </div>
    <div class="layout">
      <div class="floors" id="floors"></div>
      <aside class="side" id="side1"></aside>
    </div>
  </section>

  <!-- STEP 2: details -->
  <section id="s2" hidden aria-labelledby="h2">
    <div class="lock" id="lock2"></div>
    <div class="layout">
      <form class="card form" id="gform" novalidate>
        <div class="full title" style="margin:0"><h1 id="h2" data-t="h2"></h1><p data-t="p2"></p></div>
        <label class="field full"><span data-t="fName"></span><input id="g-name" autocomplete="name"><span class="err" id="e-name" hidden></span></label>
        <label class="field"><span data-t="fPhone"></span><input id="g-phone" inputmode="tel" autocomplete="tel" placeholder="98XXXXXXXX"><span class="err" id="e-phone" hidden></span></label>
        <label class="field"><span data-t="fEmail"></span><input id="g-email" type="email" autocomplete="email" placeholder="name@gmail.com"><span class="err" id="e-email" hidden></span></label>
        <div class="full steppers" id="steppers"></div>
        <label class="field"><span data-t="fArrive"></span><select id="g-arrive"></select></label>
        <label class="field"><span data-t="fId"></span><select id="g-id"><option>Aadhaar</option><option>Driving licence</option><option>Voter ID</option><option>Passport</option></select></label>
        <label class="field full"><span data-t="fGst"></span><input id="g-gst" autocapitalize="characters" placeholder="33ABCDE1234F1Z5" maxlength="15"><span class="err" id="e-gst" hidden></span></label>
        <label class="check full"><input type="checkbox" id="g-rules"><span data-t="fRules"></span></label>
        <span class="err full" id="e-rules" hidden></span>
        <div class="full acts">
          <button class="btn btn-out" type="button" id="b-change" data-t="change"></button>
          <button class="btn btn-teal" type="submit" id="b-topay"></button>
        </div>
      </form>
      <aside class="side" id="side2"></aside>
    </div>
  </section>

  <!-- STEP 3: pay -->
  <section id="s3" hidden aria-labelledby="h3">
    <div class="lock" id="lock3"></div>
    <div class="layout">
      <div class="card pay">
        <div class="title" style="margin:0"><h1 id="h3"></h1><p data-t="p3"></p></div>
        <a class="btn btn-teal btn-big" id="b-upi" href="#"></a>
        <div class="apps"><span data-t="opens"></span><b style="color:#1A73E8">Google Pay</b>·<b style="color:#5F259F">PhonePe</b>·<b style="color:#00A2D8">Paytm</b>·<b style="color:#E35205">BHIM</b></div>
        <div class="or" data-t="orScan"></div>

let LANG = "en";

/* ---------- money + dates ---------- */
const r2 = n => Math.round(n * 100) / 100;
const inr = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const inr2 = n => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const nightsOf = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const fmtD = (s, o) => new Date(s + "T00:00:00").toLocaleDateString(LANG === "ta" ? "ta-IN" : "en-IN", o || { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const fmtDen = s => new Date(s + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

/* ---------- state ---------- */
const today = iso(new Date());
const qs = new URLSearchParams(location.search);
const st = {
  step: 1, din: qs.get("in") >= today ? qs.get("in") : today, dout: null,
  wantType: qs.get("type") || "", room: null, ac: qs.get("ac") !== "0", status: {}, loading: false,
  hold: null, adults: 2, children: 0, beds: 0, booking: null, files: null
};
st.dout = qs.get("out") > st.din ? qs.get("out") : addDays(st.din, 1);

function price(){
  if (!st.room) return null;
  const ty = S.types[S.typeOf(st.room)], n = Math.max(1, nightsOf(st.din, st.dout));
  const rate = st.ac ? ty.ac : ty.nonac, bed = st.beds * S.extraBed;
  const total = (rate + bed) * n;
  const tax = r2(total * S.gstRate / (100 + S.gstRate)), cgst = r2(tax / 2), sgst = r2(tax - cgst);
  const roomTaxable = r2(rate * n * 100 / (100 + S.gstRate)), bedTaxable = r2(total - tax - roomTaxable);
  return { n, rate, bed, total, tax, cgst, sgst, taxable: r2(total - tax), roomTaxable, bedTaxable, ty };
}
function roomInfo(no){
  for (const f of S.floors){
    if (f.back.includes(no) || f.front.includes(no)) return { floor: f.id };
  }
  return { floor: "G", side: "L" };
}

/* ---------- data layer: live (web app server) or demo (this browser) ---------- */
const DEMO_KEY = "sac-demo-bookings";
const demoAll = () => { try { return JSON.parse(localStorage.getItem(DEMO_KEY) || "[]"); } catch (e) { return []; } };
const demoSave = a => { try { localStorage.setItem(DEMO_KEY, JSON.stringify(a)); } catch (e) {} };
const overlap = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const activeDemo = () => demoAll().filter(b => b.status === "paid" || (b.status === "hold" && new Date(b.hold_until) > new Date()));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

const DB = {
  status(din, dout){
    if (S.live()) return S.rpc("room_status", { p_in: din, p_out: dout }).then(rows => { const m = {}; (rows || []).forEach(r => { m[r.room] = r.state; }); return m; });
    const m = {}; activeDemo().forEach(b => { if (overlap(din, dout, b.check_in, b.check_out)) m[b.room] = b.status === "paid" ? "booked" : "hold"; });
    return Promise.resolve(m);
  },
  hold(room, din, dout){
    if (S.live()) return S.rpc("hold_room", { p_room: room, p_in: din, p_out: dout });
    const busy = activeDemo().some(b => b.room === room && overlap(din, dout, b.check_in, b.check_out));
    if (busy) return Promise.reject(Object.assign(new Error("ROOM_TAKEN"), { code: "ROOM_TAKEN" }));
    const all = demoAll(), n = all.length + 1;
    const h = { token: uid(), code: "SAC-D" + String(n).padStart(4, "0"), room, check_in: din, check_out: dout, status: "hold", hold_until: new Date(Date.now() + S.holdMinutes * 6e4).toISOString() };
    all.push(h); demoSave(all);
    return Promise.resolve({ token: h.token, code: h.code, hold_until: h.hold_until });
  },
  release(token){
    if (!token) return Promise.resolve();
    if (S.live()) return S.rpc("release_hold", { p_token: token }).catch(() => {});
    demoSave(demoAll().filter(b => !(b.token === token && b.status === "hold")));
    return Promise.resolve();
  },
  confirm(token, details, utr){
    if (S.live()) return S.rpc("confirm_payment", { p_token: token, p_details: details, p_utr: utr });
    const all = demoAll(), b = all.find(x => x.token === token);
    if (!b) return Promise.reject(new Error("Booking not found"));
    const clash = all.some(x => x !== b && x.room === b.room && overlap(b.check_in, b.check_out, x.check_in, x.check_out) && (x.status === "paid" || (x.status === "hold" && new Date(x.hold_until) > new Date())));
    if (clash) return Promise.reject(Object.assign(new Error("ROOM_TAKEN"), { code: "ROOM_TAKEN" }));
    const seq = all.filter(x => x.status === "paid").length + 1;
    Object.assign(b, { status: "paid", utr, details, amount: details.amount, invoice_no: "DEMO/" + String(seq).padStart(4, "0"), receipt_no: "DEMO-R/" + String(seq).padStart(4, "0"), paid_at: new Date().toISOString() });
    demoSave(all);
    return Promise.resolve({ code: b.code, invoice_no: b.invoice_no, receipt_no: b.receipt_no, amount: b.amount, paid_at: b.paid_at });
  }
};

/* ---------- UI helpers ---------- */
let toastT;

function setStep(n){

/* ---------- STEP 2 ---------- */
function renderSteppers(){

$("steppers").addEventListener("click", e => {

/* ---------- lock timer ---------- */
let timer;
function tick(){
  if (!st.hold || (st.step !== 2 && st.step !== 3)) return;
  const ms = new Date(st.hold.hold_until) - new Date();
  const lockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  if (ms > 0){
    const m = Math.floor(ms / 6e4), s = Math.floor(ms / 1e3) % 60, tt = `<strong>${m}:${String(s).padStart(2, "0")}</strong>`;
    $("lock2").className = $("lock3").className = "lock";
    $("lock2").innerHTML = lockSvg + "<span>" + t("lockOn", { r: st.room, t: tt }) + "</span>";
    $("lock3").innerHTML = lockSvg + "<span>" + t("lockPay", { r: st.room, t: tt }) + "</span>";
  } else if (st.step === 2){
    clearInterval(timer); DB.release(st.hold.token); st.hold = null;
    toast(t("lockOver2", { r: st.room })); st.room = null; setStep(1); loadStatus();
  } else {
    $("lock3").className = "lock over"; $("lock3").innerHTML = lockSvg + "<span>" + t("lockOver") + "</span>";
  }
}
function startTimer(){ clearInterval(timer); tick(); timer = setInterval(tick, 1000); }

function drawQR(){

  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#0F1E2E";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) g.fillRect((x + q) * px, (y + q) * px, px, px);

/* ---------- invoice + receipt (canvas → JPEG → PDF, no library) ---------- */
const logoImg = new Image(); logoImg.src = "logo-180.png";
const ONES = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function w2(n){ return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : ""); }
function w3(n){ return (n >= 100 ? ONES[Math.floor(n / 100)] + " Hundred" + (n % 100 ? " " : "") : "") + (n % 100 ? w2(n % 100) : ""); }
function words(num){
  let n = Math.round(num); if (!n) return "Zero";
  const parts = [], cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1e3); n %= 1e3;
  if (cr) parts.push(w3(cr) + " Crore"); if (lk) parts.push(w2(lk) + " Lakh"); if (th) parts.push(w2(th) + " Thousand"); if (n) parts.push(w3(n));
  return parts.join(" ");
}
function makeCanvas(){ const c = document.createElement("canvas"); c.width = 1240; c.height = 1754; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.textBaseline = "alphabetic"; return [c, g]; }
const F = (w, s) => `${w} ${s}px "Plus Jakarta Sans", Arial, sans-serif`;
function txt(g, s, x, y, o){ o = o || {}; g.font = F(o.w || 500, o.s || 22); g.fillStyle = o.c || "#0F1E2E"; g.textAlign = o.a || "left"; g.fillText(s, x, y); }
function wrap(g, s, x, y, maxW, lh, o){ o = o || {}; g.font = F(o.w || 500, o.s || 22); const ws = String(s).split(" "); let line = ""; for (const w of ws){ const tst = line ? line + " " + w : w; if (g.measureText(tst).width > maxW && line){ txt(g, line, x, y, o); y += lh; line = w; } else line = tst; } if (line) { txt(g, line, x, y, o); y += lh; } return y; }
function header(g, title, no, dateStr){
  const M = 80;
  g.fillStyle = "#0F766E"; g.fillRect(0, 0, 1240, 14);

  txt(g, B.address1, M + 130, 160, { s: 20, c: "#5B6878" });
  txt(g, B.address2, M + 130, 186, { s: 20, c: "#5B6878" });
  txt(g, "GSTIN: " + B.gstin + "   ·   State: " + B.stateName + " (" + B.stateCode + ")", M + 130, 216, { w: 700, s: 20 });
  txt(g, B.phone + "  ·  " + B.email, M + 130, 244, { s: 19, c: "#5B6878" });
  txt(g, title, 1160, 100, { w: 800, s: 34, c: "#0F766E", a: "right" });

  txt(g, dateStr, 1160, 168, { s: 20, c: "#5B6878", a: "right" });

function drawInvoice(b){
  const [c, g] = makeCanvas(), M = 80, p = b.p, ty = S.types[S.typeOf(b.room)];
  const paid = new Date(b.paid_at), pd = paid.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

  txt(g, "STAY", M + 560, 350, { w: 700, s: 18, c: "#5B6878" });

  txt(g, "Booking: " + b.code, M + 560, 484, { s: 19, c: "#33414F" });
  // table

  y += 56;
  const line = (d, q, v) => { txt(g, d, cols[0], y, { s: 21 }); txt(g, S.sac, cols[1], y, { s: 21 }); txt(g, q, cols[2], y, { s: 21 }); txt(g, inr2(v), 1160, y, { s: 21, a: "right" }); g.fillStyle = "#EEF1F4"; g.fillRect(M, y + 18, 1080, 1); y += 52; };

  if (b.beds) line("Extra bed @ " + inr(S.extraBed) + "/night incl. GST", b.beds + " × " + p.n, p.bedTaxable);
  y += 6;

  tr("Total taxable value", inr2(p.taxable));
  tr("CGST @ 2.5%", inr2(p.cgst));
  tr("SGST @ 2.5%", inr2(p.sgst));
  g.fillStyle = "#0F1E2E"; g.fillRect(cols[1], y - 22, 1160 - cols[1], 2); y += 18;
  tr("Total (incl. GST)", inr2(p.total), { w: 800, s: 28 });
  y += 10;
  y = wrap(g, "Amount in words: Rupees " + words(p.total) + " only.", M, y, 1080, 30, { s: 20, c: "#33414F" });
  txt(g, "Payment: Received in full by UPI · UTR " + b.utr + " · Receipt " + b.receipt_no, M, y + 6, { s: 20, c: "#33414F" });
  y += 60;
  g.fillStyle = "#E6E9EE"; g.fillRect(M, y, 1080, 2); y += 40;
  y = wrap(g, "Check-in any time, 24 hours. Please bring a valid photo ID for every adult. No smoking. No pets.", M, y, 700, 28, { s: 18, c: "#5B6878" });
  txt(g, "For " + B.name, 1160, 1560, { w: 700, s: 22, a: "right" });
  txt(g, "Authorised signatory", 1160, 1596, { s: 18, c: "#5B6878", a: "right" });
  txt(g, "This is a computer-generated invoice and does not need a signature.", M, 1660, { s: 17, c: "#8A95A3" });
  return c;
}
function drawReceipt(b){
  const [c, g] = makeCanvas(), M = 80;
  const paid = new Date(b.paid_at);
  header(g, "PAYMENT RECEIPT", "Receipt No: " + b.receipt_no, paid.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }));

  txt(g, "This is a computer-generated receipt.", M, 1660, { s: 17, c: "#8A95A3" });
  return c;
}
function jpegPdf(canvas){
  const data = atob(canvas.toDataURL("image/jpeg", 0.92).split(",")[1]);
  const W = 595.28, H = 841.89, enc = new TextEncoder();
  const content = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  const objs = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`,
    null,
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`
  ];
  const parts = [], offs = []; let len = 0;
  const push = s => { const u = typeof s === "string" ? enc.encode(s) : s; parts.push(u); len += u.length; };
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  objs.forEach((o, i) => {
    offs.push(len);
    if (i === 3){
      const img = new Uint8Array(data.length); for (let k = 0; k < data.length; k++) img[k] = data.charCodeAt(k);
      push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);
      push(img); push("\nendstream\nendobj\n");
    } else push(`${i + 1} 0 obj\n${o}\nendobj\n`);
  });
  const xref = len;
  push(`xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: "application/pdf" });
}
function renderDocs(){
  const b = st.booking;

    st.files = {

      rcp: new File([jpegPdf(cr)], "Receipt-" + safe(b.receipt_no) + ".pdf", { type: "application/pdf" })
    };
  });
}
function download(file){

}
